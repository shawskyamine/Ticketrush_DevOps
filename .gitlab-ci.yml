include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

image: maven:3.9-eclipse-temurin-21

stages:
  - build
  - test
  - security
  - package      # ← Nouveau
  - image-scan   # ← Nouveau

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DB_URL: "jdbc:postgresql://postgres:5432/ticketrush"
  DB_USER: "ticketrush"
  DB_PASSWORD: "ticketrush"

cache:
  key: "maven-cache"
  paths:
    - .m2/repository/

build-job:
  stage: build
  script:
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - target/

test-job:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: ticketrush
        POSTGRES_PASSWORD: ticketrush
        POSTGRES_DB: ticketrush
  script:
    - mvn verify

trivy-dependency-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script:
    - apk add --no-cache maven
    - mvn dependency:resolve -DskipTests --no-transfer-progress
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL --no-progress --offline-scan --format table .
  allow_failure: false

# ==========================================
# NOUVEAU : Build et push de l'image Docker
# ==========================================
build-image:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

# ==========================================
# NOUVEAU : Scan de l'image avec Trivy
# ==========================================
scan-image:
  stage: image-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  allow_failure: false
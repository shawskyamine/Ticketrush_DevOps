spring:
  application:
    name: ticketrush
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketrush}
    username: ${DB_USER:ticketrush}
    password: ${DB_PASSWORD:ticketrush}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

ticketrush:
  booking:
    strategy: atomic